name: Build and publish macOS release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test optimized build
        run: |
          xcodebuild -project 'Silde Film Viewer.xcodeproj' -scheme 'Silde Film Viewer' -configuration Release -derivedDataPath "$RUNNER_TEMP/tests" -destination 'platform=macOS' -only-testing:'Silde Film ViewerTests' ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO test
      - name: Archive universal application
        run: |
          xcodebuild -project 'Silde Film Viewer.xcodeproj' -scheme 'Silde Film Viewer' -configuration Release -derivedDataPath "$RUNNER_TEMP/build" -archivePath "$RUNNER_TEMP/Silde.xcarchive" -destination 'generic/platform=macOS' ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO archive
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP="$RUNNER_TEMP/Silde.xcarchive/Products/Applications/Silde Film Viewer.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ZIP="Silde-Film-Viewer-${RELEASE_TAG}-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Silde Film Viewer ${RELEASE_TAG}" --notes-file "docs/RELEASE-${RELEASE_TAG#v}.md"
          gh release upload "$RELEASE_TAG" "$ZIP" SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false
